[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basel-credit-capital-engine"
version = "0.1.0"
description = "Transparent educational engine for Basel credit RWA, stress testing and capital adequacy."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Keyur Marolia"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "ipykernel>=6.29,<7",
  "jupyter-client>=8.6,<9",
  "Jinja2>=3.1,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F401"]
