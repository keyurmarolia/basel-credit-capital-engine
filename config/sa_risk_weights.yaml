notes:
  - Educational selected-scope mapping; consult CRE20 and jurisdictional rules before real use.
  - Residential real-estate implementation uses the Basel whole-loan LTV approach.
  - LTV risk weights depend on whether repayment materially depends on property cash flows.
  - The numeric value 999 is only an internal open-ended lookup sentinel. It is displayed as Above 100% and is never interpreted as an LTV.
