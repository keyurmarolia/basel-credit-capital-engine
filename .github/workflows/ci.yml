name: Validate Basel Credit Capital Engine

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint source and tests
        run: ruff check src tests scripts
      - name: Run automated tests
        run: pytest
      - name: Build a CI-sized portfolio
        run: python scripts/run_pipeline.py --portfolio-size 2000
      - name: Build and execute notebooks
        run: python scripts/execute_notebooks.py
      - name: Audit notebook outputs
        run: python scripts/audit_notebooks.py
